name: Release event probe
on:
  release:
    types: [published, released, edited, created, prereleased]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "event_name=${{ github.event_name }}"
          echo "action=${{ github.event.action }}"
          echo "tag=${{ github.event.release.tag_name }}"
          echo "draft=${{ github.event.release.draft }} prerelease=${{ github.event.release.prerelease }}"
