name: Wheels

on:
  workflow_dispatch:
    inputs:
      prebuild_run_id:
        description: Optional prebuild workflow run id to download CLN/GiNaC artifacts from
        required: false
        type: string
      petsc_prebuild_run_id:
        description: Optional "Prebuild PETSc/SLEPc" run id to take the macOS arm64 PETSc artifact from (defaults to the latest successful run)
        required: false
        type: string
      prerequisites:
        description: >-
          auto = enforce the release prerequisites only on a release (a manual dispatch builds
          straight away), force = enforce them here too, skip = build without checking anything
        required: false
        type: choice
        default: auto
        options: [auto, force, skip]
      upload_from_run_id:
        description: >-
          Publish the wheels and sdist that an EARLIER run of this workflow already built, instead of
          building anything: give that run's id. Nothing is compiled, no prerequisite is checked, and
          the artifacts are taken as they are. For the case where the build was green and only the
          upload did not happen - artifacts live 90 days, so the run has to be recent enough.
        required: false
        type: string
        default: ""
  workflow_run:
    workflows:
      - Prebuild static CLN/GiNaC
    types:
      - completed
  release:
    types:
      - published

env:
  # Wheels for these versions are built individually, each its own classic
  # (version-specific ABI) wheel: nanobind's STABLE_ABI support (see
  # CMakeLists.txt) requires CPython >= 3.12, so 3.10/3.11 can't use it and
  # need a separate build each. Add/remove versions here as support windows
  # change; cibuildwheel builds every matching version within a single job.
  PYTHON_VERSIONS_LEGACY: "3.10 3.11"
  # The lowest CPython version nanobind's Stable ABI targets
  # (Py_LIMITED_API=0x030C0000). Only ONE wheel is built for this version -
  # tagged cp312-abi3-<platform> via pyproject.toml's
  # [[tool.cibuildwheel.overrides]] wheel.py-api=cp312 setting - and, being
  # ABI-stable, it is then installable on every later CPython release too
  # (3.13, 3.14, 3.15, ...) without a rebuild, which is the whole point of
  # building against the stable ABI. Do NOT add 3.13/3.14/3.15 etc. as their
  # own build identifiers below - that would just rebuild the same thing
  # redundantly. If nanobind ever raises its own Limited API baseline above
  # 3.12, bump this (and CMakeLists.txt's STABLE_ABI comment / pyproject.toml's
  # wheel.py-api value) together.
  PYTHON_STABLE_ABI_BASE: "3.12"

# Release prerequisites
# ---------------------
# Publishing must not be the first time anything is checked, so a "release" event runs through a
# gate before a single wheel is built. Four things have to be in place, and the `prereqs` job below
# decides for each of them whether it already is; whatever is missing is RUN FIRST, as a called
# workflow, and the wheel jobs wait for it:
#
#   * Prebuild static CLN/GiNaC        - satisfied by ANY successful run, on any commit. That is the
#   * Prebuild PETSc/SLEPc               same rule the download steps below already use ("latest
#                                        successful run"), and both build third-party sources that
#                                        do not move with pyoomph's own commits.
#   * Build one wheel per OS and run the test suite, with full_suite=true
#   * Run the tutorial scripts on a fresh wheel, with omp=3
#                                      - these two must have run on THIS commit, so a successful run
#                                        is only accepted if its head SHA equals github.sha and its
#                                        title carries the right parameter markers (see the
#                                        `run-name:` line in each of those files - the Actions API
#                                        does not expose a run's dispatch inputs, which is why the
#                                        parameters are encoded in the title).
#
# Consequence worth knowing before pressing "Publish release": if neither has been run on the
# release commit, the release run itself will spend hours on the full suite and the tutorial pass
# before it builds anything. Running both from the Actions tab on the release branch beforehand is
# the fast path - the gate then finds them and skips straight to the wheels.
#
# Another consequence: a prerequisite that this workflow ran ITSELF, via workflow_call, is part of
# this run and does not show up as a run of its own workflow, so re-running the release run from
# scratch will run it again.
#
# A workflow_run trigger (a prebuild finished) is deliberately NOT gated - it would turn every
# prebuild into an afternoon of tutorials - and a manual dispatch is gated only with
# prerequisites=force.

jobs:
  prereqs:
    name: Check release prerequisites
    # Nothing here needs to run for the prebuild-completed trigger; the wheel jobs keep their own
    # copy of that condition. Nor for an upload-only dispatch, which certifies nothing and builds
    # nothing - the run it takes its artifacts from is what was gated.
    if: >-
      ${{ inputs.upload_from_run_id == ''
          && (github.event_name != 'workflow_run'
              || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gh run list reads other workflows' runs.
      actions: read
    outputs:
      need_ginac: ${{ steps.check.outputs.need_ginac }}
      need_petsc: ${{ steps.check.outputs.need_petsc }}
      need_suite: ${{ steps.check.outputs.need_suite }}
      need_tutorials: ${{ steps.check.outputs.need_tutorials }}
    steps:
      - name: Decide what still has to run
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          MODE: ${{ github.event.inputs.prerequisites }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          MODE="${MODE:-auto}"

          need_ginac=false; need_petsc=false; need_suite=false; need_tutorials=false
          enforce=true
          if [[ "${MODE}" == "skip" ]]; then
            enforce=false
            echo "prerequisites=skip: building without checking anything."
          elif [[ "${MODE}" == "auto" && "${EVENT_NAME}" != "release" ]]; then
            enforce=false
            echo "prerequisites=auto on a ${EVENT_NAME} event: the gate applies to releases only."
          fi

          # Any successful run at all, on any commit - the same rule the artifact download steps use.
          any_success() {
            local id
            id="$(gh run list --workflow "$1" --repo "${GITHUB_REPOSITORY}" \
                    --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            # gh exits 0 on "no runs matched", so the emptiness is what decides, not the status.
            [[ -n "${id}" ]] || return 1
            echo "${id}"
          }

          # A successful run of $1 on exactly ${SHA} whose title contains every remaining argument.
          # The markers come from that workflow's run-name; see the header of this file.
          marked_success() {
            local wf="$1"; shift
            local rows id sha title marker ok
            rows="$(gh run list --workflow "${wf}" --repo "${GITHUB_REPOSITORY}" \
                      --status success --limit 100 \
                      --json databaseId,headSha,displayTitle \
                      --jq '.[] | [.databaseId, .headSha, .displayTitle] | @tsv')"
            while IFS=$'\t' read -r id sha title; do
              [[ -n "${id:-}" ]] || continue
              [[ "${sha}" == "${SHA}" ]] || continue
              ok=yes
              for marker in "$@"; do
                [[ "${title}" == *"${marker}"* ]] || ok=no
              done
              [[ "${ok}" == "yes" ]] || continue
              echo "${id}"
              return 0
            done <<< "${rows}"
            return 1
          }

          report() { echo "- **$1**: $2" >> "${GITHUB_STEP_SUMMARY}"; echo "$1: $2"; }

          if [[ "${enforce}" == "true" ]]; then
            echo "### Release prerequisites for ${SHA}" >> "${GITHUB_STEP_SUMMARY}"

            if id="$(any_success prebuild_static_ginac_cln.yml)"; then
              report "Prebuild static CLN/GiNaC" "satisfied by run ${id}"
            else
              need_ginac=true; report "Prebuild static CLN/GiNaC" "MISSING - will be run now"
            fi

            if id="$(any_success prebuild_petsc_slepc.yml)"; then
              report "Prebuild PETSc/SLEPc" "satisfied by run ${id}"
            else
              need_petsc=true; report "Prebuild PETSc/SLEPc" "MISSING - will be run now"
            fi

            if id="$(marked_success test_wheel_suite.yml '[full_suite=true]')"; then
              report "Full test suite on this commit" "satisfied by run ${id}"
            else
              need_suite=true
              report "Full test suite on this commit" "MISSING - will be run now (hours)"
            fi

            if id="$(marked_success tutorial_scripts.yml '[omp=3]' '[platforms=all]')"; then
              report "Tutorial scripts (omp=3) on this commit" "satisfied by run ${id}"
            else
              need_tutorials=true
              report "Tutorial scripts (omp=3) on this commit" "MISSING - will be run now (hours)"
            fi
          fi

          {
            echo "need_ginac=${need_ginac}"
            echo "need_petsc=${need_petsc}"
            echo "need_suite=${need_suite}"
            echo "need_tutorials=${need_tutorials}"
          } >> "${GITHUB_OUTPUT}"

  prereq_prebuild_ginac:
    name: Prerequisite - prebuild CLN/GiNaC
    needs: prereqs
    if: needs.prereqs.outputs.need_ginac == 'true'
    uses: ./.github/workflows/prebuild_static_ginac_cln.yml

  prereq_prebuild_petsc:
    name: Prerequisite - prebuild PETSc/SLEPc
    needs: prereqs
    if: needs.prereqs.outputs.need_petsc == 'true'
    # Left at that workflow's own defaults on purpose - in particular python_version 3.12, which has
    # to stay equal to PYTHON_STABLE_ABI_BASE above, since the Stable ABI job is the only one that
    # installs petsc4py. The env context is not available in a reusable call's `with:`, so the two
    # cannot be tied together mechanically; change them together.
    uses: ./.github/workflows/prebuild_petsc_slepc.yml

  prereq_suite:
    name: Prerequisite - full test suite
    # The prebuilds first: the suite downloads both of their artifacts.
    needs: [prereqs, prereq_prebuild_ginac, prereq_prebuild_petsc]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && needs.prereqs.outputs.need_suite == 'true' }}
    uses: ./.github/workflows/test_wheel_suite.yml
    with:
      # The exact commit being released, not a branch name: the branch may have moved on since the
      # tag was cut, and then this would certify the wrong tree.
      ref: ${{ github.sha }}
      full_suite: true

  prereq_tutorials:
    name: Prerequisite - tutorial scripts
    needs: [prereqs, prereq_prebuild_ginac, prereq_prebuild_petsc]
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && needs.prereqs.outputs.need_tutorials == 'true' }}
    uses: ./.github/workflows/tutorial_scripts.yml
    with:
      ref: ${{ github.sha }}
      omp: "3"

  build_wheels:
    needs: [prereqs, prereq_prebuild_ginac, prereq_prebuild_petsc, prereq_suite, prereq_tutorials]
    # !cancelled() rather than success(): the four prerequisite jobs are SKIPPED whenever the gate
    # found them already satisfied, and a skipped dependency would otherwise skip this job too.
    # What must not happen is building on a failed one, hence the explicit failure check.
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && inputs.upload_from_run_id == ''
          && (github.event_name != 'workflow_run'
              || github.event.workflow_run.conclusion == 'success') }}
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            runner: ubuntu-latest
            platform: linux
            prebuild_artifact: static-ginac-cln-linux-x86_64
          - label: macos-intel-x86_64
            runner: macos-15-intel
            platform: macos
            prebuild_artifact: static-ginac-cln-macos-intel-x86_64
          - label: macos-arm64
            runner: macos-14
            platform: macos
            prebuild_artifact: static-ginac-cln-macos-arm64
            # The one platform whose SUITE runs against PETSc/SLEPc: there is no MKL on Apple
            # silicon, so PETSc/MUMPS is what pyoomph's autodetection picks there for the linear
            # solver and SLEPc for the eigensolver, and until now no CI job exercised either.
            # It changes nothing about the wheel itself, which is built with PYOOMPH_USE_MPI=OFF
            # and links no PETSc; only the cibuildwheel TEST environment sees it. Everywhere else
            # the wheel's built-in spectra eigensolver over Pardiso is what the suite runs on.
            petsc_artifact: petsc-slepc-macos-arm64
          - label: windows-msys2-ucrt64
            runner: windows-latest
            platform: windows
            prebuild_artifact: static-ginac-cln-windows-msys2-ucrt64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Compute cibuildwheel build selectors
        id: cibw
        shell: bash
        run: |
          LEGACY_SELECTOR=""
          for v in ${PYTHON_VERSIONS_LEGACY}; do
            LEGACY_SELECTOR="${LEGACY_SELECTOR:+$LEGACY_SELECTOR }cp${v//./}-*"
          done
          echo "legacy_selector=${LEGACY_SELECTOR}" >> "${GITHUB_OUTPUT}"
          echo "stable_abi_selector=cp${PYTHON_STABLE_ABI_BASE//./}-*" >> "${GITHUB_OUTPUT}"

      - name: Resolve prebuild run id
        id: prebuild
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_RUN_ID: ${{ github.event.inputs.prebuild_run_id }}
        shell: bash
        run: |
          if [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            RUN_ID="${WORKFLOW_RUN_ID}"
          elif [[ -n "${MANUAL_RUN_ID}" ]]; then
            RUN_ID="${MANUAL_RUN_ID}"
          else
            RUN_ID="$(gh run list \
              --workflow prebuild_static_ginac_cln.yml \
              --repo "${GITHUB_REPOSITORY}" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')"
          fi

          if [[ -z "${RUN_ID}" || "${RUN_ID}" == "null" ]]; then
            echo "Could not resolve a successful prebuild run id" >&2
            exit 1
          fi

          # See the same step in test_wheel_suite.yml: "latest successful run" says nothing about
          # which COMMIT built the artifact, and an artifact predating the GiNaC determinism
          # patches is the one failure mode that used to reach a shipped wheel. Record it here so
          # the release has the provenance of what it linked against.
          PRE_SHA="$(gh run view "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
                       --json headSha --jq '.headSha' 2>/dev/null || echo unknown)"
          PRE_AT="$(gh run view "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
                      --json createdAt --jq '.createdAt' 2>/dev/null || echo unknown)"
          echo "Using prebuild run id ${RUN_ID} (built from ${PRE_SHA} at ${PRE_AT})"
          {
            echo "### Static CLN/GiNaC artifact"
            echo "- run \`${RUN_ID}\`, built from commit \`${PRE_SHA}\` at ${PRE_AT}"
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "run_id=${RUN_ID}" >> "${GITHUB_OUTPUT}"

      - name: Download matching static prebuild artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          rm -rf prebuilt
          mkdir -p prebuilt
          gh run download "${{ steps.prebuild.outputs.run_id }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${{ matrix.prebuild_artifact }}" \
            --dir prebuilt

      - name: Show downloaded artifact layout
        shell: bash
        run: |
          find prebuilt -maxdepth 5 -type d | sort
          find prebuilt -maxdepth 5 -type f | sort | head -n 200

      - name: Install build dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libglu1-mesa-dev libxcursor-dev libopengl0

      # macOS wheels thread through GCD/libdispatch (PYOOMPH_USE_GCD below), which links no OpenMP
      # runtime and so cannot collide with the Intel libiomp5 that MKL's Pardiso loads. No static
      # libomp is built here any more; citools/build_static_libomp.sh remains for the opt-in
      # OpenMP-on-mac path (PYOOMPH_USE_OPENMP=ON).

      # The PETSc/SLEPc prebuild for the macOS arm64 suite. Only the Stable ABI step below uses it:
      # petsc4py/slepc4py are compiled extension modules, and the artifact carries exactly one cpXY
      # build - the Stable ABI one, PYTHON_STABLE_ABI_BASE - so the legacy (3.10/3.11) tier stays on
      # spectra, which is also what those wheels' users get.
      - name: Resolve the PETSc/SLEPc prebuild run id
        if: matrix.petsc_artifact
        id: petsc_prebuild
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_RUN_ID: ${{ github.event.inputs.petsc_prebuild_run_id }}
        shell: bash
        run: |
          if [[ -n "${MANUAL_RUN_ID}" ]]; then
            RUN_ID="${MANUAL_RUN_ID}"
          else
            RUN_ID="$(gh run list \
              --workflow prebuild_petsc_slepc.yml \
              --repo "${GITHUB_REPOSITORY}" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')"
          fi
          [[ -n "${RUN_ID}" && "${RUN_ID}" != "null" ]] || {
            echo "Could not resolve a successful PETSc prebuild run id - run the 'Prebuild PETSc/SLEPc' workflow first" >&2
            exit 1; }
          echo "Using PETSc prebuild run id ${RUN_ID}"
          echo "run_id=${RUN_ID}" >> "${GITHUB_OUTPUT}"

      - name: Install the PETSc/SLEPc prebuild
        if: matrix.petsc_artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # petsc4py's extension dlopens Homebrew's libgfortran - MUMPS and ScaLAPACK are Fortran, and
          # the prebuild runner had it only because it installed gcc to compile them. The image this
          # job runs on provides no unversioned `gcc` prefix, so the import died with "Library not
          # loaded: /opt/homebrew/opt/gcc/lib/gcc/current/libgfortran.5.dylib" - and, since every
          # SLEPc test only asks whether petsc4py imports, as a wall of failures half an hour into
          # the suite rather than here. Checked, not assumed, for the same reason.
          brew install gcc || brew link --overwrite gcc
          test -e "$(brew --prefix gcc)/lib/gcc/current/libgfortran.5.dylib"
          rm -rf petsc-prebuilt && mkdir -p petsc-prebuilt
          gh run download "${{ steps.petsc_prebuild.outputs.run_id }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "${{ matrix.petsc_artifact }}-cp${PYTHON_STABLE_ABI_BASE//./}" \
            --dir petsc-prebuilt
          # Unpacked at the absolute path it was CONFIGURED with: PETSc bakes the prefix into
          # petscvariables, the RPATHs and the macOS install_names, so anywhere else fails to import.
          sudo mkdir -p /opt
          sudo tar xzf petsc-prebuilt/pyoomph-petsc.tar.gz -C /opt
          cat /opt/pyoomph-petsc/env.sh
          set -a; source /opt/pyoomph-petsc/env.sh; set +a
          # Handed to the SUITE only, through CIBW_TEST_ENVIRONMENT below, never exported into the
          # job: a petsc4py on PYTHONPATH during the build would leak into the isolated build
          # environment cibuildwheel creates.
          #
          # The COMPLEX arch, not env.sh's real one. pyoomph takes SLEPc wherever petsc4py imports,
          # so a real build would not fall back to spectra for the azimuthal and Hopf cases - it
          # would run them and truncate every complex target to its real part.
          # PYOOMPH_EXPECT_COMPLEX_SLEPC turns tests/test_slepc_present.py from a skip into an
          # assertion, so a PETSc that did not reach the test venv fails the job instead of quietly
          # letting the whole suite run on spectra.
          COMPLEX_LIB="${PETSC_DIR}/${PETSC_ARCH_COMPLEX}/lib"
          echo "PYOOMPH_PETSC_TEST_ENV=PYOOMPH_EXPECT_COMPLEX_SLEPC=1 PETSC_DIR=${PETSC_DIR} PETSC_ARCH_REAL=${PETSC_ARCH_REAL} PETSC_ARCH_COMPLEX=${PETSC_ARCH_COMPLEX} PYTHONPATH=${COMPLEX_LIB} DYLD_LIBRARY_PATH=${PETSC_DIR}/mpi/lib:${COMPLEX_LIB}" >> "${GITHUB_ENV}"

      # Split into two cibuildwheel invocations (both appending into the same
      # wheelhouse/ dir) rather than one combined CIBW_BUILD selector: cibuildwheel
      # env vars *always* win over pyproject.toml, including its
      # [[tool.cibuildwheel.overrides]] entries (see cibuildwheel's docs,
      # "Configuration overrides" - "environment variables will completely
      # override any TOML configuration"), so a single shared CIBW_CONFIG_SETTINGS
      # env var covering both tiers could never let the cp312-only
      # wheel.py-api=cp312 setting take effect. Each step below sets its own
      # CIBW_CONFIG_SETTINGS instead.
      - name: Build legacy (classic ABI) wheels with cibuildwheel (Linux/macOS)
        if: matrix.platform != 'windows'
        env:
          CIBW_BUILD: ${{ steps.cibw.outputs.legacy_selector }}
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS: native
          CIBW_BUILD_FRONTEND: build
          CIBW_BEFORE_ALL_LINUX: >
            bash -lc 'if command -v dnf >/dev/null 2>&1; then dnf -y install wget bzip2 patch;
            elif command -v yum >/dev/null 2>&1; then yum -y install wget bzip2 patch;
            elif command -v apk >/dev/null 2>&1; then apk add --no-cache wget bzip2 patch;
            elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y wget bzip2 patch;
            else echo "No supported package manager for before-all" >&2; exit 1; fi'
          CIBW_BEFORE_TEST_LINUX: >
            bash -lc 'if command -v dnf >/dev/null 2>&1; then dnf -y install mesa-libGLU libXcursor libglvnd-opengl libXinerama;
            elif command -v yum >/dev/null 2>&1; then yum -y install mesa-libGLU libXcursor libglvnd-opengl libXinerama;
            elif command -v apk >/dev/null 2>&1; then apk add --no-cache glu libxcursor libxinerama || apk add --no-cache mesa libxcursor libxinerama || true;
            elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y libglu1-mesa libxcursor1 libopengl0 libxinerama1;
            else echo "No supported package manager for before-test" >&2; exit 1; fi'
          CIBW_ENVIRONMENT: >
            PYOOMPH_GINAC_INCLUDE_DIR=$PWD/prebuilt/GiNaC_static/install/include
            PYOOMPH_GINAC_LIB_DIR=$PWD/prebuilt/GiNaC_static/install/lib
            PYOOMPH_CLN_INCLUDE_DIR=$PWD/prebuilt/GiNaC_static/install/include
            PYOOMPH_CLN_LIB_DIR=$PWD/prebuilt/GiNaC_static/install/lib
            MACOSX_DEPLOYMENT_TARGET=10.13
          CIBW_CONFIG_SETTINGS: >
            cmake.define.PYOOMPH_DOWNLOAD_CLN=OFF
            cmake.define.PYOOMPH_DOWNLOAD_GINAC=OFF
            cmake.define.PYOOMPH_ASSUME_GINAC_HASH_PATCHED=ON
            cmake.define.PYOOMPH_USE_MPI=OFF
            cmake.define.PYOOMPH_PARANOID=OFF
            ${{ matrix.platform == 'macos' && 'cmake.define.PYOOMPH_USE_GCD=ON' || 'cmake.define.PYOOMPH_USE_OPENMP=ON' }}
            cmake.define.PYOOMPH_HAS_SPECTRA=ON
          # The backend define above (OpenMP on Linux, GCD on macOS) already turns a missing backend
          # into a CONFIGURE error; this only covers what CMake cannot see: an extension that reports
          # the capability but whose runtime never actually threads the element loop. EXPECT_OPENMP
          # asserts OpenMP specifically (Linux), EXPECT_THREADED asserts either backend (macOS/GCD,
          # where has_openmp is false). Without it tests/test_openmp_present.py skips - a from-source
          # build defaults to AUTO and is entitled to whatever backend the platform provides.
          CIBW_TEST_ENVIRONMENT: ${{ matrix.platform == 'macos' && 'PYOOMPH_EXPECT_THREADED=1 PYOOMPH_EXPECT_SPECTRA=1 PYOOMPH_EXPECT_STUBS=1' || 'PYOOMPH_EXPECT_OPENMP=1 PYOOMPH_EXPECT_SPECTRA=1 PYOOMPH_EXPECT_STUBS=1' }}
        uses: pypa/cibuildwheel@v4.1.0
        with:
          output-dir: wheelhouse

      - name: Build Stable ABI wheel with cibuildwheel (Linux/macOS)
        if: matrix.platform != 'windows'
        env:
          CIBW_BUILD: ${{ steps.cibw.outputs.stable_abi_selector }}
          CIBW_SKIP: "*-musllinux_*"
          CIBW_ARCHS: native
          CIBW_BUILD_FRONTEND: build
          CIBW_BEFORE_ALL_LINUX: >
            bash -lc 'if command -v dnf >/dev/null 2>&1; then dnf -y install wget bzip2 patch;
            elif command -v yum >/dev/null 2>&1; then yum -y install wget bzip2 patch;
            elif command -v apk >/dev/null 2>&1; then apk add --no-cache wget bzip2 patch;
            elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y wget bzip2 patch;
            else echo "No supported package manager for before-all" >&2; exit 1; fi'
          CIBW_BEFORE_TEST_LINUX: >
            bash -lc 'if command -v dnf >/dev/null 2>&1; then dnf -y install mesa-libGLU libXcursor libglvnd-opengl libXinerama;
            elif command -v yum >/dev/null 2>&1; then yum -y install mesa-libGLU libXcursor libglvnd-opengl libXinerama;
            elif command -v apk >/dev/null 2>&1; then apk add --no-cache glu libxcursor libxinerama || apk add --no-cache mesa libxcursor libxinerama || true;
            elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y libglu1-mesa libxcursor1 libopengl0 libxinerama1;
            else echo "No supported package manager for before-test" >&2; exit 1; fi'
          CIBW_ENVIRONMENT: >
            PYOOMPH_GINAC_INCLUDE_DIR=$PWD/prebuilt/GiNaC_static/install/include
            PYOOMPH_GINAC_LIB_DIR=$PWD/prebuilt/GiNaC_static/install/lib
            PYOOMPH_CLN_INCLUDE_DIR=$PWD/prebuilt/GiNaC_static/install/include
            PYOOMPH_CLN_LIB_DIR=$PWD/prebuilt/GiNaC_static/install/lib
            MACOSX_DEPLOYMENT_TARGET=10.13
          # wheel.py-api=cp312 tags the wheel cp312-abi3 instead of cp312-cp312,
          # matching CMakeLists.txt's nanobind_add_module(... STABLE_ABI ...)
          # (which compiles this build against Py_LIMITED_API=0x030C0000). Must
          # only be set here, never for the legacy-tier step above: applying it
          # to a non-STABLE_ABI (< 3.12) build would tag a classic, version-
          # specific extension as if it were forward-ABI-compatible, which it
          # is not, and would break at import time on any other interpreter.
          CIBW_CONFIG_SETTINGS: >
            cmake.define.PYOOMPH_DOWNLOAD_CLN=OFF
            cmake.define.PYOOMPH_DOWNLOAD_GINAC=OFF
            cmake.define.PYOOMPH_ASSUME_GINAC_HASH_PATCHED=ON
            cmake.define.PYOOMPH_USE_MPI=OFF
            cmake.define.PYOOMPH_PARANOID=OFF
            ${{ matrix.platform == 'macos' && 'cmake.define.PYOOMPH_USE_GCD=ON' || 'cmake.define.PYOOMPH_USE_OPENMP=ON' }}
            cmake.define.PYOOMPH_HAS_SPECTRA=ON
            wheel.py-api=cp312
          # See the same variables in the legacy step above. PYOOMPH_PETSC_TEST_ENV is empty
          # everywhere but macOS arm64, where the step above filled it in with the prebuilt complex
          # PETSc/SLEPc - this is the one tier whose interpreter matches that artifact's cpXY.
          CIBW_TEST_ENVIRONMENT: ${{ matrix.platform == 'macos' && 'PYOOMPH_EXPECT_THREADED=1 PYOOMPH_EXPECT_SPECTRA=1 PYOOMPH_EXPECT_STUBS=1' || 'PYOOMPH_EXPECT_OPENMP=1 PYOOMPH_EXPECT_SPECTRA=1 PYOOMPH_EXPECT_STUBS=1' }} ${{ env.PYOOMPH_PETSC_TEST_ENV }}
        uses: pypa/cibuildwheel@v4.1.0
        with:
          output-dir: wheelhouse

      - name: Set up MSYS2
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            patch
            git
            pkgconf
            base-devel
            mingw-w64-ucrt-x86_64-toolchain

      - name: Build wheel with cibuildwheel (Windows/MSYS2)
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        env:
          CC: gcc
          CXX: g++
        run: |
          export PATH="$(cygpath -u "$pythonLocation"):$PATH"
          python -m pip install --upgrade pip
          python -m pip install --upgrade "cibuildwheel==4.1.0" delvewheel

          PREBUILT_WIN="$(cygpath -m "$PWD/prebuilt/GiNaC_static/install")"

          export CIBW_ARCHS="AMD64"
          export CIBW_BUILD_FRONTEND="build"
          export CIBW_ENVIRONMENT_WINDOWS="CC=gcc CXX=g++ CXXFLAGS='-static-libgcc -static-libstdc++' LDFLAGS='-static-libgcc -static-libstdc++' PYOOMPH_GINAC_INCLUDE_DIR=${PREBUILT_WIN}/include PYOOMPH_GINAC_LIB_DIR=${PREBUILT_WIN}/lib PYOOMPH_CLN_INCLUDE_DIR=${PREBUILT_WIN}/include PYOOMPH_CLN_LIB_DIR=${PREBUILT_WIN}/lib"
          export CIBW_REPAIR_WHEEL_COMMAND_WINDOWS="delvewheel repair --add-path C:/msys64/ucrt64/bin -w {dest_dir} {wheel}"
          # See the Linux/macOS steps above: makes tests/test_openmp_present.py assert instead of skip.
          export CIBW_TEST_ENVIRONMENT="PYOOMPH_EXPECT_OPENMP=1 PYOOMPH_EXPECT_SPECTRA=1 PYOOMPH_EXPECT_STUBS=1"

          mkdir -p wheelhouse

          # Two separate cibuildwheel invocations, not one combined CIBW_BUILD
          # selector - as in the Linux/macOS steps above, CIBW_CONFIG_SETTINGS
          # (an env var) always wins over pyproject.toml's
          # [[tool.cibuildwheel.overrides]], so the cp312-only
          # wheel.py-api=cp312 setting needs its own env var scope, set only
          # for the Stable ABI build below - never for the legacy one.

          LEGACY_SELECTOR=""
          for v in ${PYTHON_VERSIONS_LEGACY}; do
            LEGACY_SELECTOR="${LEGACY_SELECTOR:+$LEGACY_SELECTOR }cp${v//./}-win_amd64"
          done
          export CIBW_BUILD="${LEGACY_SELECTOR}"
          export CIBW_CONFIG_SETTINGS="cmake.args=-GUnix\ Makefiles cmake.define.PYOOMPH_DOWNLOAD_CLN=OFF cmake.define.PYOOMPH_DOWNLOAD_GINAC=OFF cmake.define.PYOOMPH_ASSUME_GINAC_HASH_PATCHED=ON cmake.define.PYOOMPH_USE_MPI=OFF cmake.define.PYOOMPH_PARANOID=OFF cmake.define.PYOOMPH_USE_OPENMP=ON cmake.define.PYOOMPH_HAS_SPECTRA=ON"
          python -m cibuildwheel --output-dir wheelhouse

          export CIBW_BUILD="cp${PYTHON_STABLE_ABI_BASE//./}-win_amd64"
          export CIBW_CONFIG_SETTINGS="cmake.args=-GUnix\ Makefiles cmake.define.PYOOMPH_DOWNLOAD_CLN=OFF cmake.define.PYOOMPH_DOWNLOAD_GINAC=OFF cmake.define.PYOOMPH_ASSUME_GINAC_HASH_PATCHED=ON cmake.define.PYOOMPH_USE_MPI=OFF cmake.define.PYOOMPH_PARANOID=OFF cmake.define.PYOOMPH_USE_OPENMP=ON cmake.define.PYOOMPH_HAS_SPECTRA=ON wheel.py-api=cp312"
          python -m cibuildwheel --output-dir wheelhouse

      - name: Verify NO_MPI marker in wheel
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import sys
          import zipfile

          wheels = sorted(pathlib.Path("wheelhouse").glob("*.whl"))
          if not wheels:
              print("No wheels found in wheelhouse", file=sys.stderr)
              sys.exit(1)

          missing = []
          for wheel in wheels:
              with zipfile.ZipFile(wheel) as zf:
                  names = set(zf.namelist())
              if "pyoomph/NO_MPI" not in names:
                  missing.append(wheel.name)

          if missing:
              print("NO_MPI marker missing in:", ", ".join(missing), file=sys.stderr)
              sys.exit(1)

          print("NO_MPI marker verified in", len(wheels), "wheel(s)")

          # Sanity-check the Stable ABI tagging (see CMakeLists.txt's
          # nanobind_add_module(... STABLE_ABI ...) and pyproject.toml's
          # wheel.py-api=cp312 config-setting, applied only to the cp312
          # build): the cp312 wheel must be tagged "abi3", and no other
          # (legacy, non-STABLE_ABI) wheel may claim that tag - it would be
          # lying about being forward-ABI-compatible.
          bad_tags = []
          for wheel in wheels:
              python_tag, abi_tag = wheel.stem.split("-")[-3:-1]
              if python_tag == "cp312":
                  if abi_tag != "abi3":
                      bad_tags.append(f"{wheel.name}: expected abi3 tag, got {abi_tag!r}")
              elif abi_tag == "abi3":
                  bad_tags.append(f"{wheel.name}: unexpected abi3 tag on a non-cp312 wheel")

          if bad_tags:
              print("Stable ABI tagging looks wrong:", "; ".join(bad_tags), file=sys.stderr)
              sys.exit(1)

          print("Stable ABI tagging verified for", len(wheels), "wheel(s)")
          PY

      - name: Upload built wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.label }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  build_sdist:
    needs: [prereqs, prereq_prebuild_ginac, prereq_prebuild_petsc, prereq_suite, prereq_tutorials]
    # !cancelled() rather than success(): the four prerequisite jobs are SKIPPED whenever the gate
    # found them already satisfied, and a skipped dependency would otherwise skip this job too.
    # What must not happen is building on a failed one, hence the explicit failure check.
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && inputs.upload_from_run_id == ''
          && (github.event_name != 'workflow_run'
              || github.event.workflow_run.conclusion == 'success') }}
    name: sdist
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build sdist
        run: |
          python -m pip install --upgrade build
          python -m build --sdist --outdir dist

      - name: Install build dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y wget bzip2 patch libglu1-mesa-dev libxcursor-dev libopengl0

      - name: Test sdist install in a fresh venv
        run: |
          python -m venv /tmp/sdist-test-venv
          /tmp/sdist-test-venv/bin/pip install --upgrade pip
          /tmp/sdist-test-venv/bin/pip install "$PWD"/dist/*.tar.gz
          # Run from outside the checkout: cwd is implicitly on sys.path, and
          # this repo's own pyoomph/ source directory would otherwise shadow
          # the installed package in site-packages.
          cd /tmp
          /tmp/sdist-test-venv/bin/python -c "import pyoomph._version as v; print('pyoomph', v.__version__, 'installed from sdist OK')"

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  upload_pypi:
    name: Upload to PyPI
    needs: [build_wheels, build_sdist]
    # Two ways in, and !cancelled() rather than success() because the second one SKIPS both build
    # jobs deliberately:
    #
    #   * a release, which is the normal path;
    #   * a manual dispatch naming an earlier run of this workflow in upload_from_run_id, for the
    #     case where that run built and tested everything and only the upload did not happen. This
    #     stays in wheels.yml rather than becoming a workflow of its own on purpose: PyPI's trusted
    #     publisher is bound to a workflow FILENAME, so a second file would be rejected until it was
    #     registered on PyPI as well.
    #
    # The release half deliberately does NOT also test github.event.action == 'published'. That term
    # was here, it was redundant - `on.release.types` below is [published], so a release-triggered
    # run IS a publish and nothing else can reach this job - and on the 0.2.0 release it evaluated
    # false anyway. Every wheel and the sdist built and passed, and the upload was then skipped;
    # re-running the job alone against the same payload skipped it again, so the payload did not
    # carry the action the term asked for. Why is unexplained: a probe workflow confirms that both a
    # fresh non-draft create and the publishing of a draft emit `published` (alongside `released`
    # and, for a create, `created`), and no GitHub changelog entry describes a payload whose action
    # differs from the type that matched it. Rather than keep a redundant check that is capable of
    # withholding a release, the types filter is left to do the one job it already does.
    if: >-
      ${{ !cancelled()
          && !contains(needs.*.result, 'failure')
          && (github.event_name == 'release'
              || (github.event_name == 'workflow_dispatch'
                  && inputs.upload_from_run_id != '')) }}
    runs-on: ubuntu-latest
    environment: release

    permissions:
      id-token: write  # mandatory for trusted publishing
      # Reading another run's artifacts, for the upload_from_run_id path.
      actions: read

    steps:
      # run-id defaults to this run, so the release path is unchanged; with upload_from_run_id set
      # the artifacts come from that run instead. github-token is required whenever run-id is given,
      # even for a run in the same repository.
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
          run-id: ${{ inputs.upload_from_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
          run-id: ${{ inputs.upload_from_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Show what is about to be uploaded
        run: ls -la dist

      - uses: pypa/gh-action-pypi-publish@release/v1
